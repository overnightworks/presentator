packages:
  - .

# Registry packages resolve only to releases at least seven days old (minutes).
minimumReleaseAge: 10080

# Security pins for transitive dependencies, each kept until its parents depend
# on the fixed range themselves:
# - minimatch below 11.0.1 (GHSA-g3hv-75wg-m249, medium denial of service) is
#   still required by @eslint/config-array, @typescript-eslint/typescript-estree
#   and eslint (^10) and by @redocly/openapi-core, which pins minimatch 5.1.9.
# - glob below 14.0.2 (GHSA-3g3m-2fjr-6pw4) is still required by test-exclude
#   (^13), through vite-plugin-istanbul.
# minimatch 11 breaks one call of @redocly/openapi-core: lib/utils.js calls
# require('minimatch') as a function, which only happens for remote specs with
# header matching. The lobby's type generation reads a local file and never
# reaches it; keep that in mind before pointing it at a remote spec or removing
# the minimatch override.

# deepmerge 4.3.1 has an unfixed prototype-poisoning advisory (GHSA-gcqx-w48m-w2h4).
# vite-plugin-svelte's one call site is patched to merge itself, as design and
# songmaker do, and the override drops the now unused dependency from the lockfile.
patchedDependencies:
  '@sveltejs/vite-plugin-svelte@7.3.1': patches/@sveltejs__vite-plugin-svelte@7.3.1.patch

overrides:
  deepmerge: '-'
  minimatch: ^11.0.1
  glob: ^14.0.2
