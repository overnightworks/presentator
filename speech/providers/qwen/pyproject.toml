[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-presentator-qwen-provider"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "overnightworks-presentator-speech-provider-contract",
    "qwen-tts==0.1.1",
]

[project.scripts]
presentator-qwen-worker = "presentator_qwen.__main__:main"

[tool.uv]
# gradio, pinned by the model package, caps pillow below the release that fixes its advisories; the provider never decodes images.
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.sources]
overnightworks-presentator-speech-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/presentator_qwen"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D103", "INP001", "PLC0415", "S101", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D101", "D102", "D103", "D107", "ANN001", "PLR2004"]
"src/presentator_qwen/__main__.py" = ["PLC0415"]
"src/presentator_qwen/model.py" = ["PLC0415", "TC003"]
