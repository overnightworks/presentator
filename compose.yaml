# One service is the instance, and a second, the build worker, runs every
# step of a deck's build for it over a socket, because a deck is code. What has
# to survive the instance stands in a named volume; what may never be written
# down here is a file secret.

services:
  presentator:
    build:
      context: .
    image: presentator
    user: presentator
    restart: unless-stopped
    # The edge's proxy routes by these labels (ADR 0019); the talk host is the
    # same service under its own name.
    labels:
      traefik.enable: "true"
      edge.name: presentator
      edge.alias: presentator-talk
      traefik.http.services.presentator.loadbalancer.server.port: "8000"
      traefik.docker.network: presentator_default
    # `agent` is the one the agent service answers on and `backchannel` the one
    # the identity provider reaches the logout route on; the edge owns and
    # creates both.
    networks:
      default: {}
      agent: {}
      backchannel:
        aliases:
          - presentator.hallucinai.de
    # A pull's git and ssh children need a reaper.
    init: true
    # Plain values stand here as literals: the edge runs Compose with the
    # caller's whole environment, which must not decide them. The trusted proxy
    # is the gateway of `presentator_default` below.
    environment:
      PRESENTATOR_PUBLIC_ORIGIN: https://presentator.hallucinai.de
      PRESENTATOR_TALK_ORIGIN: https://presentator-talk.hallucinai.de
      PRESENTATOR_OIDC_ISSUER: https://auth.hallucinai.de/realms/hallucinai
      PRESENTATOR_OIDC_CLIENT_ID: presentator
      PRESENTATOR_TRUSTED_PROXIES: 172.31.251.1
      PRESENTATOR_AGENT_SERVICE: http://agent-service:8080
      PRESENTATOR_BUILD_RUNNER: worker
      PRESENTATOR_SECRET_KEY_FILE: /run/secrets/presentator_secret_key
      PRESENTATOR_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    # The instance's two secrets, mounted read-only at /run/secrets/<name>;
    # the build worker gets neither.
    secrets:
      - presentator_secret_key
      - oidc_client_secret
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m,nr_inodes=10k,mode=1777,nosuid,nodev
    # The proxy asks the instance's own /health with the public host the
    # instance serves; the origin comes from the container's environment.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.parse, urllib.request; host = urllib.parse.urlsplit(os.environ['PRESENTATOR_PUBLIC_ORIGIN']).hostname; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': host}), timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # The worker answers on a socket in the volume it owns; the web only waits
    # for it to be started and retries until it answers.
    depends_on:
      build-worker:
        condition: service_started
    volumes:
      - database:/data/database
      - mirrors:/data/mirrors
      - builds:/data/builds
      - type: volume
        source: build-socket
        target: /run/presentator-build
        volume:
          nocopy: true

  # The sealed build worker (ADR 0017). It runs the instance image and starts
  # no step of its own accord; the instance hands it each one. It never pulls:
  # `docker compose build presentator` has to make the image first, and a
  # missing one is an error rather than a pull of some registry's
  # `presentator`. Every key below is a boundary the worker's
  # self-check or ADR 0017 relies on, and `tests/test_compose.py` pins them.
  build-worker:
    image: presentator
    pull_policy: never
    # The base image's entrypoint is a shell that exports its own variables
    # into the controller's environment, which the self-check refuses.
    entrypoint: []
    command: ["presentator-worker"]
    # Root with the runtime user's group: the controller is PID 1, drops to the
    # unprivileged users per child, and owns the socket for that group.
    user: "0:presentator"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges
    read_only: true
    network_mode: none
    ipc: private
    shm_size: 256m
    pids_limit: 512
    # Swap would double the bound, so the two are one number.
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    # PID 1 receives only the signals it has a handler for, and the controller
    # has none; SIGKILL ends it at once and the kernel then ends the namespace.
    stop_signal: SIGKILL
    tmpfs:
      - /work:size=2g,nr_inodes=200k,mode=755,nosuid,nodev
      - /tmp:size=512m,nr_inodes=10k,mode=1777,nosuid,nodev
    volumes:
      - type: volume
        source: build-socket
        target: /run/presentator-build
        volume:
          nocopy: true
    # Named without a value: a variable the project's environment does not set
    # stays unset, and the worker's own defaults apply.
    environment:
      - PRESENTATOR_BUILD_TIMEOUT_SECONDS
      - PRESENTATOR_BUILD_OUTPUT_MEGABYTES

# Fixed, so that the address every connection through the edge's proxy
# carries is a value written down here rather than read off a network Docker
# numbered by chance.
networks:
  default:
    name: presentator_default
    ipam:
      config:
        - subnet: 172.31.251.0/24
          gateway: 172.31.251.1
  agent:
    external: true
    name: hal_agent_presentator
  backchannel:
    external: true
    name: hal_backchannel_presentator

# Files in the operator's home, never environment variables.
secrets:
  presentator_secret_key:
    file: ${HOME}/.secrets/presentator/secret-key
  oidc_client_secret:
    file: ${HOME}/.secrets/keycloak/clients/presentator

volumes:
  database:
  mirrors:
  builds:
  # A tmpfs that starts as root's private 0750, so the instance cannot plant an
  # entry before the worker tightens the directory itself.
  build-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16k,nr_inodes=8,mode=0750,uid=0
