<head>
  <script>
    // An opaque origin throws on any access to the storage properties, and
    // Slidev reads localStorage while its modules load; an in-memory store
    // stands in so the build starts.
    for (const name of ['localStorage', 'sessionStorage']) {
      try {
        void window[name]
      } catch {
        window.blockedStorage = [...(window.blockedStorage ?? []), name]
        const entries = new Map()
        Object.defineProperty(window, name, {
          value: {
            getItem: (key) => entries.get(key) ?? null,
            setItem: (key, value) => { entries.set(key, String(value)) },
            removeItem: (key) => { entries.delete(key) },
            clear: () => { entries.clear() },
            key: (index) => [...entries.keys()][index] ?? null,
            get length() { return entries.size },
          },
        })
      }
    }
  </script>
</head>
