[gate]
mandatory_jobs = ["Python: architecture, lint, types", "Python: tests", "Frontend: lint, types, tests, deck build", "Lobby: lint, types, tests, drive", "Coverage report", "Container image", "Build worker: k3d pod"]

[[gate.loosened]]
what = 'mandatory job "Co-presenter: lint, tests" removed'
item = "#477"
date = 2026-10-24
reason = "the host co-presenter package is deleted (D1 of #355, operator ruling 21.10.2026); its job checks code that no longer exists"

[[gate.loosened]]
what = 'mandatory job "Build worker: sealed step" removed'
item = "#1097"
date = 2026-11-12
reason = "the Compose deployment it drove is switched off and presentator serves from the platform's cluster; its Docker probe backend, its job and compose.yaml leave together, and the pod shape stays proven by the mandatory job \"Build worker: k3d pod\""

[[gate.loosened]]
what = 'import contract "Only adapters import agent_runtime_client" removed'
item = "#993"
date = 2026-11-10
reason = "the contract is renamed, not dropped: \"Only adapters import agents\" forbids the same source modules from importing the renamed library; api stays out of the source modules because each route module declares its agent-tool decision beside the route with agents.tools, the one module import-linter cannot separate from the rest of the library, and tests/presentator/agent/test_backend_imports.py (C14) holds api to that module alone"

[[gate.loosened]]
what = 'import contract "Only adapters import speech_runtime_client" removed'
item = "#978"
date = 2026-11-09
reason = "the contract is renamed, not dropped: \"Only adapters import speech_client\" forbids the same source modules from importing the renamed client library"

[[gate.loosened]]
what = 'import contract "Only adapters read the manifest format and word a language" removed'
item = "#1075"
date = 2026-11-12
reason = "the contract is renamed, not dropped: \"Only adapters read the manifest format\" forbids the same source modules from importing tomllib; babel left the runtime dependencies with the catalog adapter, so no layer imports it and the words come from the generated module"

[[size.generated]]
path = "frontend/src/lib/api/types.ts"
job = "Lobby: lint, types, tests, drive"
item = "#708"
date = 2026-11-08
reason = "written by pnpm generate:types, proven by the job's git diff --exit-code on src/lib/api"

