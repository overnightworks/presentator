sonar.organization=overnightworks
sonar.projectKey=overnightworks_presentator
sonar.sources=src,slidev
sonar.tests=tests,slidev/tests

# Sonar refuses to index a file as source and test at once, and neither the
# installed packages, the lockfile, the prose nor a built deck are code.
sonar.exclusions=slidev/tests/**,slidev/node_modules/**,slidev/pnpm-lock.yaml,slidev/README.md,slidev/.nvmrc,examples/**/dist/**
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# The gate's `sonar` job downloads the `coverage` artifact that the `coverage`
# job merges from the Python and Slidev test jobs; both reports sit at the
# artifact's root, the common directory of its uploads.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info

# why: tool configuration is not product code, so an uncovered vitest config
# line must not fail the quality gate.
#
# why: the overlay components run only inside a built deck in a real browser,
# which the vitest node process cannot measure; their browser tests drive them
# through the real interface instead.
sonar.coverage.exclusions=slidev/vitest.config.ts,slidev/components/CoPresenter.vue,slidev/custom-nav-controls.vue
