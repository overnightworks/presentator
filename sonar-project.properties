sonar.organization=overnightworks
sonar.projectKey=overnightworks_presentator
sonar.sources=src,slidev,frontend/src
sonar.tests=tests,slidev/tests,frontend/src
# The lobby keeps its unit tests beside the module they prove.
sonar.test.inclusions=tests/**,slidev/tests/**,frontend/src/**/*.test.ts

# Sonar refuses to index a file as source and test at once, and neither the
# installed packages, the lockfile, the prose nor a built deck are code; the
# lobby's wire types and their OpenAPI document are generated.
sonar.exclusions=slidev/tests/**,slidev/node_modules/**,slidev/pnpm-lock.yaml,slidev/README.md,slidev/.nvmrc,examples/**/dist/**,frontend/src/**/*.test.ts,frontend/src/lib/api/types.ts,frontend/src/lib/api/openapi.json
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# The gate's `sonar` job downloads the `coverage` artifact that the `coverage`
# job merges from the Python, Slidev and lobby test jobs; every report sits at
# the artifact's root, the common directory of its uploads, so each carries
# its own file name.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info,lcov-lobby.info

# why: tool configuration is not product code, so an uncovered vitest config
# line must not fail the quality gate.
#
# why: the overlay components run only inside a built deck in a real browser,
# which the vitest node process cannot measure; their browser tests drive them
# through the real interface instead.
sonar.coverage.exclusions=slidev/vitest.config.ts,slidev/components/CoPresenter.vue,slidev/custom-nav-controls.vue,slidev/room-notice.js,slidev/global-top.vue
