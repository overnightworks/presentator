version: 2
updates:
  - package-ecosystem: github-actions
    # `directories` accepts globs, so the repository's composite actions are read too
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-root:
        update-types: [minor, patch]
    ignore:
      # Dependabot looks a direct git reference up on PyPI by name, so a name taken there later could propose a package against the git pin
      - dependency-name: "overnightworks-*"
  - package-ecosystem: npm
    directory: /slidev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-slidev:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-frontend:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # The Node major moves Dockerfile, the engines fields and CI together: a deliberate lane, not a bot PR
      - dependency-name: node
        update-types: ["version-update:semver-major"]
