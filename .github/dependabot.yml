version: 2
updates:
  - package-ecosystem: github-actions
    # `directories` accepts globs, so the repository's composite actions are read too
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-root:
        update-types: [minor, patch]
    ignore:
      # Dependabot looks a direct git reference up on PyPI by name, so a name taken there later could propose a package against the git pin
      - dependency-name: "overnightworks-*"
  - package-ecosystem: uv
    directory: /speech
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-speech:
        update-types: [minor, patch]
        # GPU/model-coupled pins stay single PRs so each lands with its own speech/GPU proof
        exclude-patterns:
          - "nvidia-*"
          - "numpy"
          - "faster-whisper"
          - "piper-tts"
  - package-ecosystem: uv
    directory: /speech/providers/chatterbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-chatterbox:
        update-types: [minor, patch]
        exclude-patterns:
          - "numpy"
          - "chatterbox-tts"
    ignore:
      # resemble-perth 1.0.1 imports pkg_resources, which setuptools removed in 82 (speech/README.md)
      - dependency-name: setuptools
        versions: [">=82"]
  - package-ecosystem: uv
    directory: /speech/providers/magpie
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-magpie:
        update-types: [minor, patch]
        exclude-patterns:
          - "numpy"
          - "torch*"
          - "nemo-toolkit*"
  - package-ecosystem: uv
    directory: /speech/providers/qwen
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-qwen:
        update-types: [minor, patch]
        exclude-patterns:
          - "numpy"
          - "qwen-tts"
  - package-ecosystem: uv
    directory: /speech/providers/voxcpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-voxcpm:
        update-types: [minor, patch]
        exclude-patterns:
          - "numpy"
          - "voxcpm"
  - package-ecosystem: npm
    directory: /slidev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-slidev:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-frontend:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # The Node major moves Dockerfile, the engines fields and CI together: a deliberate lane, not a bot PR
      - dependency-name: node
        update-types: ["version-update:semver-major"]
