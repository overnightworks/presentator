name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

# A pull request collapses onto its newest push; a run on main or a schedule
# keeps a group of its own, so no landing is ever cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@915acb8df197c4765b6637b4f3ab67f2fba09c4a # v0.21.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
