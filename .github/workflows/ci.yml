name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request collapses onto its newest push, but every push to main keeps a
# group of its own so no landing is ever cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: "Python: architecture, lint, types"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-uv

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Check types
        run: uv run --locked pyright

      - name: Check for dead code
        run: uv run --locked vulture

      - name: Check the catalogs and the generated words
        run: uv run --locked design-catalogs --check

      - name: Check catalog purity
        run: uv run --locked python scripts/check_catalog_purity.py

  tests:
    name: "Python: tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-uv

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run --locked pytest -q -n auto --cov=src --cov-report=xml:reports/coverage.xml

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: reports/coverage.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  speech:
    name: "Speech: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          cache-dependency-glob: |
            speech/uv.lock
            speech/providers/chatterbox/uv.lock

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Test
        run: uv run --locked pytest -q

  chatterbox-provider:
    name: "Speech: Chatterbox provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech/providers/chatterbox
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          cache-dependency-glob: |
            speech/uv.lock
            speech/providers/chatterbox/uv.lock

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        run: uv run --locked pytest -q tests

  qwen-provider:
    name: "Speech: Qwen provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech/providers/qwen
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          cache-dependency-glob: speech/providers/qwen/uv.lock

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        run: uv run --locked pytest -q tests/test_main.py tests/test_model.py

  voxcpm-provider:
    name: "Speech: VoxCPM provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech/providers/voxcpm
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          cache-dependency-glob: speech/providers/voxcpm/uv.lock

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        run: uv run --locked pytest -q tests/test_main.py tests/test_model.py

  magpie-provider:
    name: "Speech: Magpie provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech/providers/magpie
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: $/.github/actions/setup-uv
        with:
          cache-dependency-glob: speech/providers/magpie/uv.lock
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src
      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src
      - name: Test
        run: uv run --locked pytest -q tests/test_main.py tests/test_model.py

  slidev:
    name: "Frontend: lint, types, tests, deck build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: slidev
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pnpm has to exist before setup-node so that its cache can be primed.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: slidev/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: slidev/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: slidev/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # No --with-deps: the runner image ships the browsers' libraries,
      # and apt on the runner's mirror can stall.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      # The overlay browser tests (through presenter-overlay-harness.ts) read
      # the production security policy through this Python environment, so they
      # need this instance's own copy too — never a second, hand-copied value of it.
      - name: Install uv
        uses: $/.github/actions/setup-uv

      - name: Install locked Python dependencies
        working-directory: .
        run: uv sync --locked --all-groups

      - name: Check source
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-slidev
          path: reports/slidev-coverage
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Build the example deck
        run: pnpm build:example

      - name: Upload the built example deck
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-deck
          path: examples/hello-deck/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  lobby:
    name: "Lobby: lint, types, tests, drive"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pnpm has to exist before setup-node so that its cache can be primed.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The frozen install also holds design's tarball to the integrity the
      # lockfile carries.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # No --with-deps: the runner image ships the browsers' libraries,
      # and apt on the runner's mirror can stall.
      - name: Install Chromium and Firefox
        run: pnpm exec playwright install chromium firefox

      # The OpenAPI document comes from the lobby's routes, and the drive
      # serves the build from the lobby itself, so both need this instance's
      # Python environment.
      - name: Install uv
        uses: $/.github/actions/setup-uv

      - name: Install locked Python dependencies
        working-directory: .
        run: uv sync --locked --all-groups

      - name: Check source
        run: pnpm lint

      - name: Check types
        run: pnpm check

      - name: Generate the OpenAPI document from the lobby's routes
        working-directory: .
        run: uv run --locked python -m tests.support.lobby_drive openapi frontend/src/lib/api/openapi.json

      - name: Check that the OpenAPI document and the wire types are generated
        run: pnpm generate:types && git diff --exit-code -- src/lib/api

      - name: Test
        run: pnpm test

      # Only this job builds the instrumented lobby; the image builds the
      # production one. The drive writes its counters beside vitest's.
      - name: Build the instrumented lobby
        run: pnpm build:instrumented

      - name: Drive the lobby in Chromium and Firefox
        run: pnpm drive

      # Vitest and the drive count the same source files; the lobby's branches
      # are checked on their sum, so no vitest-only threshold asks for tests
      # that mirror the drive.
      - name: Merge the lobby's coverage and check its branches
        run: pnpm coverage:merge

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lobby
          path: reports/lobby-coverage/lcov-lobby.info
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # The pictures are kept on a green run too, so each page slice has its
      # I7 screenshots from CI; the traces are kept on a failure only.
      - name: Upload the drive's screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lobby-drive-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the drive's traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lobby-drive
          path: frontend/test-results/
          retention-days: 7

  image:
    name: "Container image"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag presentator:${{ github.sha }} .

      - name: Prove a configured UID that already belongs to the base image
        run: |
          docker build --build-arg PRESENTATOR_RUNTIME_UID=1000 --tag presentator:uid-1000 .
          test "$(docker inspect --format '{{.Config.User}}' presentator:uid-1000)" = 1000
          docker run --rm presentator:uid-1000 sh -c 'test "$(id -u)" = 1000 && test "$HOME" = /home/presentator'

      - name: Prove the build and wire users exist (cell 1)
        run: |
          image=presentator:${{ github.sha }}
          for user in presentator-build presentator-wire; do
            entry=$(docker run --rm "$image" getent passwd "$user") || {
              echo "user $user does not exist in the image" >&2
              exit 1
            }
            user_id=$(echo "$entry" | cut -d: -f3)
            login_shell=$(echo "$entry" | cut -d: -f7)
            if [ "$user_id" = 0 ]; then
              echo "user $user has UID 0" >&2
              exit 1
            fi
            case "$login_shell" in
              */nologin) ;;
              *)
                echo "user $user has login shell $login_shell, which does not end in nologin" >&2
                exit 1
                ;;
            esac
          done
          for uid in 61001 61002 061001; do
            if docker build --progress=plain --build-arg PRESENTATOR_RUNTIME_UID=$uid --tag presentator:uid-$uid . > "uid-$uid.log" 2>&1; then
              echo "a runtime uid of $uid was accepted" >&2
              exit 1
            fi
            # Build output lines carry a step number and a time before the
            # message; the echoed command does not, so a failure of another
            # kind does not pass for the refusal.
            grep -Eq '^#[0-9]+ [0-9.]+ PRESENTATOR_RUNTIME_UID must be a positive integer' "uid-$uid.log" || {
              echo "a runtime uid of $uid failed without the refusal message" >&2
              cat "uid-$uid.log" >&2
              exit 1
            }
          done

      - name: Prove the image holds no Docker client (cell B17)
        run: docker run --rm presentator:${{ github.sha }} sh -c '! command -v docker'

      # An image without CA certificates builds cleanly and only fails once a
      # real HTTPS source is added, so the proof has to be an actual TLS
      # fetch, not a package-list check. The target is a public repository
      # distinct from this one, so the test does not depend on this
      # repository's own reachability.
      - name: Smoke test HTTPS reachability
        run: docker run --rm presentator:${{ github.sha }} git ls-remote https://github.com/git/git.git HEAD

  # The sealed step runs in parallel parts, each on a runner of its own that
  # builds the image itself. A leg's name and its probe argument come from one
  # matrix entry, so they cannot drift apart: `part` is the probe's argument and
  # an upload shard's `shard` of `shards` is its share of cell 50's rows. The
  # job `build-worker` below is the mandatory name and aggregates the legs.
  build-worker-parts:
    name: "Build worker: ${{ matrix.label }}${{ matrix.shards && format(' {0} of {1}', matrix.shard, matrix.shards) || '' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: socket cells
            part: cells
          - label: refused uploads
            part: uploads
            shard: 1
            shards: 4
          - label: refused uploads
            part: uploads
            shard: 2
            shards: 4
          - label: refused uploads
            part: uploads
            shard: 3
            shards: 4
          - label: refused uploads
            part: uploads
            shard: 4
            shards: 4
          - label: deployed web
            part: web
    # The file carries its plain values as literals; the probe reads the web's
    # hostname from this environment, and the override below copies both origins
    # into the web. The worker has no env_file and names only the two build
    # variables. The web runs with a client secret that only this job knows.
    env:
      COMPOSE_PROJECT_NAME: build-worker-probe
      PRESENTATOR_PUBLIC_ORIGIN: https://presentator.example.invalid
      PRESENTATOR_TALK_ORIGIN: https://talks.example.invalid
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Compose mounts the three secrets from the runner's home as file secrets;
      # the container's user reads them, so the files are world-readable and
      # the directories above them stay private.
      - name: Write the throwaway secret files
        run: |
          key=$(openssl rand -hex 32)
          client_secret=$(openssl rand -hex 32)
          gateway_key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "::add-mask::$client_secret"
          echo "::add-mask::$gateway_key"
          mkdir -m 0700 -p "$HOME/.secrets/presentator" "$HOME/.secrets/keycloak/clients" "$HOME/.secrets/litellm/apps"
          chmod 0700 "$HOME/.secrets" "$HOME/.secrets/keycloak" "$HOME/.secrets/litellm"
          (umask 0133 && printf '%s\n' "$key" > "$HOME/.secrets/presentator/secret-key")
          (umask 0133 && printf '%s\n' "$client_secret" > "$HOME/.secrets/keycloak/clients/presentator")
          (umask 0133 && printf '%s\n' "$gateway_key" > "$HOME/.secrets/litellm/apps/presentator")

      - name: Install uv
        uses: $/.github/actions/setup-uv

      - name: Install the probe's tools
        run: |
          uv sync --locked

      - name: Build the image the worker runs
        run: docker compose build presentator

      # The edge builds, then pulls what is not buildable, then creates; the
      # worker's `presentator` image has no build of its own and never pulls.
      - name: Check that a pull leaves the worker's image alone
        if: ${{ matrix.part == 'cells' }}
        run: |
          before=$(docker image inspect --format '{{.Id}}' presentator)
          docker compose pull --ignore-buildable --quiet > /dev/null 2>&1
          after=$(docker image inspect --format '{{.Id}}' presentator)
          test -n "$before" && test "$before" = "$after"

      - name: Drive the sealed worker through its socket
        if: ${{ matrix.part != 'web' }}
        env:
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: uv run --locked python scripts/probe_build_worker.py drive "$PART" $SHARD $SHARDS

      # The web needs no issuer at start: the sign-in client reads only the
      # secret file, and the issuer is called at sign-in. The override adds
      # two read-only bind mounts to the web, publishes the probe's port, which
      # compose.yaml never does, and sets what the literals of compose.yaml do
      # not give the probe. A read-only root cannot take a copy.
      # A day, far beyond this job's timeout: the web's poll sweeps every build
      # run no deck row names, and the probe lays runs of its own under the
      # builds root that no row names.
      - name: Prepare the web's throwaway settings
        if: ${{ matrix.part == 'web' }}
        run: |
          cat > "$RUNNER_TEMP/web-probe.yaml" <<EOF
          services:
            presentator:
              ports:
                - "127.0.0.1:8000:8000"
              environment:
                PRESENTATOR_PUBLIC_ORIGIN: $PRESENTATOR_PUBLIC_ORIGIN
                PRESENTATOR_TALK_ORIGIN: $PRESENTATOR_TALK_ORIGIN
                PRESENTATOR_OIDC_ISSUER: https://auth.example.invalid/realms/probe
                PRESENTATOR_OIDC_CLIENT_ID: build-worker-probe
                PRESENTATOR_SOURCE_POLL_SECONDS: "86400"
              volumes:
                - type: bind
                  source: $GITHUB_WORKSPACE/examples/hello-deck
                  target: /decks/hello-deck
                  read_only: true
                - type: bind
                  source: $GITHUB_WORKSPACE/examples/copresenter-deck
                  target: /decks/copresenter-deck
                  read_only: true
                - type: bind
                  source: $GITHUB_WORKSPACE/scripts/probe_build_worker
                  target: /decks/probe
                  read_only: true
          EOF
          echo "WEB_PROBE_OVERRIDE=$RUNNER_TEMP/web-probe.yaml" >> "$GITHUB_ENV"
          # Internal like the edge's, so the web's gateway is its own network's.
          for network in hal_agent_presentator hal_backchannel_presentator hal_speech_presentator; do
            docker network create --internal "$network" > /dev/null 2>&1 \
              || { echo "could not create the network $network"; exit 1; }
          done

      - name: Drive the deployed web through the worker
        if: ${{ matrix.part == 'web' }}
        run: uv run --locked python scripts/probe_build_worker_web.py drive

      - name: Remove the web, the worker and their volumes
        if: ${{ always() }}
        run: |
          docker rm --force build-worker-probe-holder || true
          if [ -n "$WEB_PROBE_OVERRIDE" ]; then
            docker compose --file compose.yaml --file "$WEB_PROBE_OVERRIDE" down --volumes
          else
            docker compose down --volumes
          fi

  build-worker:
    name: "Build worker: sealed step"
    needs: build-worker-parts
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PARTS_RESULT: ${{ needs.build-worker-parts.result }}
    steps:
      - name: Fail unless every part succeeded
        run: test "$PARTS_RESULT" = success

  # The worker's pod shape in a real k3s: the driver owns the platform commit,
  # and every other name it uses is its own. The job is apart from the sealed
  # step above, which leaves with Compose.
  build-worker-k3d:
    name: "Build worker: k3d pod"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install platform's tools
        id: tools
        uses: $/.github/actions/k3d-probe-tools

      - name: Put k3d and kubectl on PATH
        env:
          DIRECTORIES: ${{ steps.tools.outputs.directories }}
        run: echo "${DIRECTORIES//:/$'\n'}" >> "$GITHUB_PATH"

      - name: Write a kubeconfig whose context is unreachable, to prove the probe leaves it alone
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'EOF'
          apiVersion: v1
          kind: Config
          current-context: sentinel
          clusters:
            - name: sentinel
              cluster:
                server: https://127.0.0.1:1
          contexts:
            - name: sentinel
              context:
                cluster: sentinel
                user: sentinel
          users:
            - name: sentinel
              user: {}
          EOF
          echo "SENTINEL_SHA256=$(sha256sum "$HOME/.kube/config" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Drive the worker's pod shape in a k3d cluster
        run: uv run --locked python scripts/probe_build_worker_k3d.py drive --platform platform

      # The driver owns the listing and its label filter, which it proves
      # against its own cluster before it goes on.
      - name: Check for leftovers after the cells drive
        if: ${{ always() }}
        run: |
          .venv/bin/python scripts/probe_build_worker_k3d.py leftovers
          echo "$SENTINEL_SHA256  $HOME/.kube/config" | sha256sum --check

      # The signal waits for the line the driver prints once its identity check
      # holds, so it never lands inside `k3d cluster create`. It goes to the
      # driver's own Python process, which `uv run` would not forward. A second
      # one follows once the teardown has begun, which must not interrupt it.
      - name: Stop a second drive with SIGTERM after its cluster is proven
        run: |
          log="$RUNNER_TEMP/sigterm-drive.log"
          .venv/bin/python scripts/probe_build_worker_k3d.py drive --platform platform > "$log" 2>&1 &
          driver=$!
          for _ in $(seq 300); do
            grep -q '^identity holds' "$log" && break
            kill -0 "$driver" 2>/dev/null || break
            sleep 1
          done
          if ! grep -q '^identity holds' "$log"; then
            cat "$log"
            echo "::error::the second drive ended or stalled before its identity check held"
            kill -KILL "$driver" 2>/dev/null || true
            exit 1
          fi
          kill -TERM "$driver"
          second=
          for _ in $(seq 30); do
            kill -0 "$driver" 2>/dev/null || break
            if [ -z "$second" ] && grep -q '^teardown:' "$log"; then
              kill -TERM "$driver"
              second=sent
            fi
            sleep 1
          done
          if kill -0 "$driver" 2>/dev/null; then
            kill -KILL "$driver"
            cat "$log"
            echo "::error::the driver did not end within 30 seconds of SIGTERM"
            exit 1
          fi
          status=0
          wait "$driver" || status=$?
          cat "$log"
          if [ -z "$second" ]; then
            echo "::error::the driver ended before it printed teardown, so no second SIGTERM landed in it"
            exit 1
          fi
          test "$status" = 143

      - name: Check for leftovers after the signalled drive
        if: ${{ always() }}
        run: |
          .venv/bin/python scripts/probe_build_worker_k3d.py leftovers
          echo "$SENTINEL_SHA256  $HOME/.kube/config" | sha256sum --check

  coverage:
    name: "Coverage report"
    needs:
      - tests
      - slidev
      - lobby
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The gate downloads the one artifact `coverage`; its Sonar scan reads
      # coverage.xml (pytest), lcov.info (the Slidev addon's vitest) and
      # lcov-lobby.info (the lobby's vitest) from the artifact's root. The
      # parts stay: a rerun of only the failed jobs re-uploads just their
      # reports, and this merge must still find all three.
      - name: Merge the coverage reports into one artifact
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          pattern: coverage-*
          delete-merged: false
          separate-directories: false
          retention-days: 7
          overwrite: true

  quality:
    name: quality
    needs:
      - python
      - tests
      - speech
      - chatterbox-provider
      - qwen-provider
      - voxcpm-provider
      - magpie-provider
      - slidev
      - lobby
      - coverage
      - image
      - build-worker
      - build-worker-k3d
    if: always()
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    permissions:
      contents: read
      actions: read
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
