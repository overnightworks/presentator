[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-presentator"
version = "0.0.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.44.5",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "overnightworks-agents[backend,mcp-server] @ git+https://github.com/overnightworks/agents@v0.59.0",
    "overnightworks-logline @ https://github.com/overnightworks/logline/releases/download/v1.4.0/overnightworks_logline-1.4.0-py3-none-any.whl#sha256=a1f36da28f7f09080219b08438208c4dca5678c92fb2e9fb3a2bdd15fe31ac30",
    "overnightworks-speech-client @ git+https://github.com/overnightworks/speech@v0.22.0#subdirectory=packages/client",
    "overnightworks-webauth[redis] @ git+https://github.com/overnightworks/webauth@v0.40.1",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "syntok==1.4.4",
    "uvicorn==0.54.0",
    "wsproto==1.3.2",
]

[project.scripts]
presentator = "presentator.host.main:main"
presentator-worker = "presentator.host.worker:main"

[dependency-groups]
dev = [
    "coverage==7.16.0",
    "overnightworks-design[catalogs] @ https://github.com/overnightworks/design/releases/download/v0.37.0/overnightworks_design-0.37.0-py3-none-any.whl#sha256=21f47850c76d247bf70d709eaf74975db1f268ee49e420f997aca94aeb0eb9f4",
    "pypdf==7.0.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pyright==1.1.414",
    "ruamel-yaml==0.19.1",
    "ruff==0.17.3",
    "types-boto3-lite[s3]==1.44.3",
    "vulture==2.16",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gitmirror", "src/presentator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
# A leak surfaces on a later test than the one that leaked; PYTHONTRACEMALLOC=25
# on a targeted run shows where the object was allocated.
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
# design-catalogs writes this module and `design-catalogs --check` holds it
# current, so its lines have no test of ours to be covered by.
omit = ["src/presentator/contracts/words.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# assert_never marks an exhaustiveness guard that pyright proves unreachable;
# excluding the whole `case _:` arm also drops the arc into it.
exclude_also = ["case _:\\n\\s+assert_never\\("]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

# The generator's defaults put the catalogs and the page's modules where the
# fleet standard names them; only the server's Python module needs a path.
[tool.design-catalogs]
python = "src/presentator/contracts/words.py"

[tool.vulture]
paths = ["src", "tests", "tests/support/vulture_allowlist.py"]

[tool.ruff]
target-version = "py314"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas; the rule fights it.
    "COM812",
    # This repository carries no per-file copyright header.
    "CPY001",
    # Python 3.14 defers annotations, so an import used only in annotations costs
    # nothing at runtime, and moving it behind TYPE_CHECKING buys no startup time
    # or cycle break here. FastAPI reads the signatures of routes registered
    # through add_api_route, which ruff cannot see, and turns a name it cannot
    # resolve into a query parameter. TC004 stays on.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.flake8-type-checking]
# These annotations are read at runtime, so TC004 keeps their imports out of TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]
runtime-evaluated-decorators = ["fastapi.APIRouter.get", "fastapi.APIRouter.delete"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"webauth.rate_limit.SingleProcessRateLimitBackend".msg = "Limits live in the Redis every pod shares: use presentator.adapters.shared_redis."

[tool.ruff.lint.per-file-ignores]
# pytest states its expectations with bare `assert`; a test's name already states
# the behaviour a docstring would repeat, and a double's method repeats the
# contract the port it stands in for already carries.
# A double honours the signature of the port it stands in for, even where its
# canned answer has no use for an argument.
# Test directories are namespace packages on purpose: pytest imports them by path
# (importlib mode), so duplicate basenames across layers do not collide.
# A test may use webauth's in-memory limiter as a double of the shared Redis.
"tests/**" = ["S101", "D102", "D103", "ARG002", "INP001", "TID251"]
# Standalone probes, run by path, not packages.
"scripts/probe_build_worker_harness.py" = ["INP001"]
"scripts/probe_build_worker_k3d.py" = ["INP001"]
"scripts/probe_build_worker_k3d_builds.py" = ["INP001"]
"scripts/probe_build_worker_k3d_cluster.py" = ["INP001"]
"scripts/probe_build_worker_k3d_lives.py" = ["INP001"]
"scripts/probe_build_worker_k3d_manifests.py" = ["INP001"]
"scripts/probe_build_worker_k3d_web.py" = ["INP001"]
"scripts/probe_build_worker_starts.py" = ["INP001"]
"scripts/probe_build_worker_web.py" = ["INP001"]
"scripts/probe_build_worker/plant_residue.py" = ["INP001"]
"scripts/probe_build_worker/web_client.py" = ["INP001"]
"scripts/probe_build_worker/hello_client.py" = ["INP001"]
"scripts/probe_build_worker/egress_probe.py" = ["INP001"]
"scripts/probe_build_worker/inbound_probe.py" = ["INP001"]
"scripts/render_probe/probe_judge.py" = ["INP001"]
"scripts/render_probe/probe_client.py" = ["INP001"]
# design-catalogs writes this module and design --check holds it current, so its
# layout is the generator's: no docstrings, single-quoted texts, lines longer than
# the line length, exception messages built in place, and the typography of the
# texts (dashes, quotation marks) that RUF001 reads as ambiguous.
"src/presentator/contracts/words.py" = ["D100", "D103", "E501", "EM102", "Q000", "RUF001", "TRY003"]
# Standalone gate, not a package.
"scripts/check_catalog_purity.py" = ["INP001"]
# Drives the check script as a subprocess against temporary and real pages.
"tests/scripts/test_check_catalog_purity.py" = ["S603"]
# `vulture` reads a whitelist as bare attribute expressions; naming a field
# there is the entry, and assigning it would only move the dead name.
"tests/support/vulture_allowlist.py" = ["B018"]
# Runs the gate shell and a stalled controller as real processes.
"tests/presentator/adapters/test_worker_children.py" = ["S603"]
# Spawns children of its own to prove which of them the reap collects.
"tests/presentator/host/test_worker_termination.py" = ["S603"]
# Drives that toolchain and that client as the stand-in scripts it puts on PATH.
"tests/presentator/adapters/test_builds.py" = ["S603"]
# Starts the installed console script, with the environment the test gives it.
"tests/support/two_processes.py" = ["S603"]
# Builds the temporary git repositories every layer that reads one is proven on.
"tests/support/git_remote.py" = ["S603", "S607"]
# Asks the real `git` whether it accepts the credential configuration it is given.
"tests/gitmirror/test_mirror.py" = ["S603", "S607"]
# Asks the same of the credential a source's own row carries.
"tests/presentator/adapters/test_decks.py" = ["S603", "S607"]

[tool.importlinter]
root_packages = ["presentator", "gitmirror"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Presentator package layers"
type = "layers"
containers = ["presentator"]
layers = ["host", "api", "application", "ports", "contracts"]

[[tool.importlinter.contracts]]
id = "adapters-reach-down-only"
name = "Adapters never reach up into application, api, or host"
type = "forbidden"
source_modules = ["presentator.adapters", "presentator.agent"]
forbidden_modules = [
    "presentator.application",
    "presentator.api",
    "presentator.host",
]
as_packages = true

[[tool.importlinter.contracts]]
id = "adapters-are-chosen-by-the-host"
name = "Only the host names an adapter"
type = "forbidden"
source_modules = [
    "presentator.application",
    "presentator.api",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["presentator.adapters", "presentator.agent"]
as_packages = true

[[tool.importlinter.contracts]]
id = "host-composes-postgres-stores"
name = "The host names the Postgres engine, migrations and stores, not their locks or row readers"
type = "forbidden"
source_modules = ["presentator.host"]
forbidden_modules = [
    "presentator.adapters.postgres.locks",
    "presentator.adapters.postgres.accounts",
]
# The stores the host composes use both; only naming them in the host is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "worker-loads-no-web-stack"
name = "The sealed build worker imports no web stack from presentator"
type = "forbidden"
# The worker serves its one wire on a raw socket; every module it loads is code
# inside the sealed container. External packages are leaves here, so a web
# framework one of them loads stays outside this contract.
source_modules = ["presentator.host.worker"]
forbidden_modules = ["uvicorn", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
id = "route-vocabulary"
name = "Routes name no port type"
type = "forbidden"
source_modules = ["presentator.api"]
forbidden_modules = ["presentator.ports"]
as_packages = true
# A route reaching a port through the application it is allowed to import is the
# legal chain, not a violation; only naming a port type in the api itself is.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "gitmirror-is-independent"
name = "gitmirror never imports the product"
type = "forbidden"
# gitmirror mirrors any remote, so it carries none of the product's vocabulary.
source_modules = ["gitmirror"]
forbidden_modules = ["presentator"]
as_packages = true

[[tool.importlinter.contracts]]
id = "gitmirror-belongs-to-an-adapter"
name = "Only an adapter names gitmirror"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["gitmirror"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the package in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "randomness-belongs-to-an-adapter"
name = "Only adapters draw randomness"
type = "forbidden"
# `ports/identity.py`: a layer above asks a port for a secret and
# draws none. The host composes the adapters that draw, so the legal chain
# runs through them; only a direct import above them is the violation.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["secrets"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "manifest-library"
name = "Only adapters read the manifest format"
type = "forbidden"
# A third-party or format library lives in the adapter that owns it.
# `tomllib` reads the deck manifest, so a layer above must ask a port.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["tomllib"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "sentence-library"
name = "Only adapters find sentence boundaries"
type = "forbidden"
# A third-party library lives in the adapter that owns it. `syntok`
# finds the boundaries, so a layer above is handed the function instead.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["syntok"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "process-spawning"
name = "Only adapters spawn a process"
type = "forbidden"
# The toolchain that builds a deck is an external process, and where
# it is spawned is the adapter that owns it. A layer above asks a port.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["subprocess"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "database-library"
name = "Only adapters import the database library"
type = "forbidden"
# A third-party library lives in the adapter that owns it, and its
# contract is written with its first import. `sqlalchemy`, `psycopg` and
# `alembic` are the Postgres store, so a layer above must ask a port instead;
# `sqlite3` is no store of this product, so no layer above names it either.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["sqlite3", "sqlalchemy", "psycopg", "alembic"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the library in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "webauth-library"
name = "Only adapters and the host import webauth"
type = "forbidden"
# The library owns the login mechanism. Adapters fill its ports;
# the host composes WebAuthConfig. The api is not in this list because the
# routes must read the installed config, sign and clear cookies, answer an
# unauthenticated request, and read client identity, and install
# CsrfOriginMiddleware (webauth.config, webauth.cookies, webauth.dependencies,
# webauth.proxies, webauth.middleware, webauth.ports).
source_modules = [
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["webauth"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "redis-library"
name = "Only adapters import the Redis client"
type = "forbidden"
# The Redis every pod shares is reached through the adapter that owns its
# clients and keys; a layer above is handed the limits and the lease.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["redis"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "encryption-library"
name = "Only adapters import the encryption library"
type = "forbidden"
# Every parameter of the encryption stands in the adapter that owns
# it, so a layer above asks a port or is handed bytes it cannot read.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["cryptography"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the library in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "private-transport-library"
name = "Only private-service adapters import httpx2"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["httpx2"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "agents-library"
name = "Only adapters import agents"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["agents"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "speech-client-library"
name = "Only adapters import speech_client"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["speech_client"]
as_packages = true
allow_indirect_imports = true
